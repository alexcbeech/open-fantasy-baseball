name: Feature request
description: Suggest an improvement to the OFB experience or developer workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operational need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior rather than only a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or competing approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related issue links.
